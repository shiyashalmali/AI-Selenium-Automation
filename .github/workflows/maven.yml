name: Java Selenium Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selenium-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      allure_report: ${{ steps.report.outputs.available }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Selenium tests
        run: mvn -B clean test

      - name: Generate Allure HTML report
        if: always()
        run: mvn -B allure:report

      - name: Check for generated Allure report
        id: report
        if: always()
        shell: bash
        run: |
          if [ -f target/site/allure-maven-plugin/index.html ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Allure HTML report was not generated."
          fi

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload report for GitHub Pages
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && steps.report.outputs.available == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin/

  deploy:
    needs: test
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.test.outputs.allure_report == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish Allure report
        id: deployment
        uses: actions/deploy-pages@v4
